[project]
name = "ingestion-workers"
version = "0.1.0"
description = "Procesos que consumen los mensajes publicados por la API de ingesta y los persisten en PostgreSQL."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
    "pydantic>=2.9",
    "pika>=1.3",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "bandit>=1.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ingestion_workers"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID252", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["ingestion_workers"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["ingestion_workers"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=ingestion_workers --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: pruebas de integración que usan servicios reales (base de datos, broker)"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["ingestion_workers"]
