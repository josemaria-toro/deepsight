[project]
name = "deepsight-analytics-api"
version = "0.1.0"
description = "API pública que actúa como backend del portal analítico: expone los datos almacenados en PostgreSQL con filtros y datos en tiempo real."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "GPL-3.0-only" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "pydantic>=2.9",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
]

[dependency-groups]
dev = [
    "black>=24.10",
    "ruff>=0.8",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pre-commit>=4.0",
    "pip-audit>=2.7",
    "bandit>=1.8",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deepsight_analytics_api"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "TID252", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["deepsight_analytics_api"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
strict = true
python_version = "3.13"
mypy_path = "src"
packages = ["deepsight_analytics_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--cov=deepsight_analytics_api --cov-report=term-missing --cov-fail-under=80"
markers = ["integration: pruebas de integración que usan servicios reales (base de datos, broker)"]
pythonpath = ["src"]

[tool.coverage.run]
branch = true
source = ["deepsight_analytics_api"]
